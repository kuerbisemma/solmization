# nginx-Konfiguration für solmization.kalikoer.com
# Ablage: /etc/nginx/sites-available/solmization.kalikoer.com.conf (Symlink in sites-enabled).
# HTTPS-Teil ergänzt certbot (`certbot --nginx -d solmization.kalikoer.com`).

# Zugriffslog ohne IP-Adressen (PRD N-11)
log_format solmization_ohne_ip '[$time_local] "$request" $status $body_bytes_sent';

server {
    server_name solmization.kalikoer.com;
    root /var/www/solmization;
    index index.html;

    access_log /var/log/nginx/solmization.access.log solmization_ohne_ip;
    # Fehlerlogs enthalten Client-IPs, daher nur kritische Meldungen
    error_log /var/log/nginx/solmization.error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Nie cachen, sonst bleiben Nutzer:innen auf alten Versionen hängen (PRD N-12)
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # .webmanifest fehlt in Ubuntus mime.types
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Dateien mit Hash im Namen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ohne Hash im Namen, ändern sich selten
    location ~ ^/(samples|fonts|icons)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri =404;
    }

    listen 80;
    listen [::]:80;
}
